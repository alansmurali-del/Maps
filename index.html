<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AryaGo - Interactive Map Search</title>
<link rel="icon" type="image/jpeg" href="IMG_7463.jpeg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="map"></div>

<!-- Header with AryaGo branding -->
<header class="header">
  <div class="header-content">
    <h1 class="logo">🗺️ AryaGo</h1>
    <p class="tagline">Explore the World</p>
  </div>
</header>

<!-- Search Bar -->
<div class="search-container">
  <div class="search-box">
    <input id="search" type="text" placeholder="Search a place..." class="search-input">
    <button id="go" class="search-btn">Go</button>
  </div>
</div>

<!-- Info Card -->
<div id="card" class="info-card">
  <div class="card-content">
    <p class="card-text">🔍 Search for a place to get started</p>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="js/app.js"></script>
</body>
</html>
